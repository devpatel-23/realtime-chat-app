services:
  # Backend Web Service on Render
  - type: web
    name: chat-app-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerContext: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        sync: false
        # Set to your frontend URL (e.g. https://your-chat-app.vercel.app)
      - key: DB_PATH
        value: ./data/chat.db
