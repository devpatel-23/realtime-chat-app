services:
  # Backend Web Service on Render
  - type: web
    name: chat-app-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm --prefix backend install && npm --prefix backend run build
    startCommand: npm --prefix backend run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CLIENT_ORIGIN
        sync: false
        # Set to your frontend URL (e.g. https://your-chat-app.vercel.app)
      - key: DB_PATH
        value: ./data/chat.db
    # Persistent disk for SQLite (Note: Requires Render Paid Plan or use ephemeral disk on free tier)
    disk:
      name: chat-data
      mountPath: /app/data
      sizeGB: 1
